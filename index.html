<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Little English</title>
  <meta name="description" content="Picture cards, pronunciation and listening games for children learning English.">
  <link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Little English, home">
      <span class="brand-blocks" aria-hidden="true"><b>L</b><b>i</b><b>t</b><b>t</b><b>l</b><b>e</b></span>
      <span class="brand-word" aria-hidden="true">English</span>
    </a>
    <div class="settings">
      <label class="zh-toggle">
        <input type="checkbox" id="zh" role="switch">
        <span class="switch" aria-hidden="true"></span>
        <span lang="zh-CN">中文</span>
      </label>
      <details class="more">
        <summary aria-label="Settings">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
        </summary>
        <div class="panel">
          <label>Voice
            <select id="accent">
              <option value="en-US">American</option>
              <option value="en-GB">British</option>
            </select>
          </label>
          <label>Speed
            <select id="speed">
              <option value="0.7">Slow</option>
              <option value="0.9">Normal</option>
            </select>
          </label>
          <label>Start at
            <select id="level">
              <option value="1">🌱 Level 1</option>
              <option value="2">🌿 Level 2</option>
              <option value="3">🌳 Level 3</option>
            </select>
          </label>
        </div>
      </details>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <p id="no-speech" class="notice" hidden>This browser can't speak words out loud. Try Chrome, Edge or Safari.</p>

  <!-- Order matters: each file uses what the files above it define. -->
  <!-- content: the words, scenes, islands, visitors, stories, letters and shows (plain data) -->
  <script src="js/art.js"></script>
  <script src="js/content/data.js"></script>
  <script src="js/content/islands.js"></script>
  <script src="js/content/visits.js"></script>
  <script src="js/content/stories.js"></script>
  <script src="js/content/letters.js"></script>
  <script src="js/content/shows.js"></script>
  <!-- standalone helpers that know nothing about the pages -->
  <script src="js/srs.js"></script>
  <script src="js/store.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/strokes.js"></script>
  <script src="js/writer.js"></script>
  <!-- shared by the pages; they talk through window.LE -->
  <script src="js/core/lesson.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/progress.js"></script>
  <script src="js/core/home.js"></script>
  <script src="js/core/settings.js"></script>
  <!-- pages -->
  <script src="js/views/map.js"></script>
  <script src="js/views/world.js"></script>
  <script src="js/views/island.js"></script>
  <script src="js/views/learn.js"></script>
  <script src="js/views/scene.js"></script>
  <script src="js/views/write.js"></script>
  <script src="js/views/story.js"></script>
  <script src="js/views/house.js"></script>
  <script src="js/views/stickers.js"></script>
  <script src="js/views/mail.js"></script>
  <script src="js/views/ship.js"></script>
  <script src="js/views/tv.js"></script>
  <!-- games -->
  <script src="js/games/results.js"></script>
  <script src="js/games/listen.js"></script>
  <script src="js/games/review.js"></script>
  <script src="js/games/spell.js"></script>
  <script src="js/games/build.js"></script>
  <script src="js/games/blend.js"></script>
  <script src="js/games/count.js"></script>
  <script src="js/games/pipsays.js"></script>
  <script src="js/games/yesno.js"></script>
  <script src="js/games/findit.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
